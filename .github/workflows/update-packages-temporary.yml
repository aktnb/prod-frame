name: Validate latest packages (temporary)
on:
  push:
    branches:
      - chore/update-packages-20261026
    paths:
      - .github/workflows/update-packages-temporary.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install latest pnpm
        run: npm install --global pnpm@latest
      - name: Update dependencies
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.type = 'module';
          pkg.engines = { node: '>=22.12.0' };
          pkg.packageManager = 'pnpm@' + execFileSync('npm', ['view', 'pnpm', 'version'], {encoding: 'utf8'}).trim();
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm update --latest
          pnpm list --depth 0
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Check extension output
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest = JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8'));
          assert.equal(manifest.manifest_version, 3);
          const paths = [
            manifest.background.service_worker,
            manifest.action.default_popup,
            ...Object.values(manifest.icons),
            ...manifest.content_scripts.flatMap(s => s.js),
            ...(manifest.web_accessible_resources ?? []).flatMap(r => r.resources).filter(p => !p.includes('*')),
            '_locales/en/messages.json',
            '_locales/ja/messages.json',
          ];
          for (const path of paths) assert.ok(fs.existsSync('dist/' + path), path);
          console.log('Verified extension manifest and ' + paths.length + ' output paths.');
          NODE
      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile
      - name: Print updated manifests for review
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          print("UPDATED_FILES_JSON=" + json.dumps({p: Path(p).read_text() for p in ["package.json", "pnpm-lock.yaml"]}))
          PY
