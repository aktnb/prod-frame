name: Check

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Verify Node.js version
        run: node -e "const fs = require('node:fs'); const assert = require('node:assert/strict'); assert.equal(process.versions.node, fs.readFileSync('.node-version', 'utf8').trim()); console.log(process.version);"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
