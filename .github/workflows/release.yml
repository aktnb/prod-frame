name: Release

on:
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Read release version from manifest
        id: version
        run: echo "tag=v$(node -p "require('./dist/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create zip
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: cd dist && zip -r "../prod-frame-${RELEASE_TAG}.zip" .

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            --raw-field "ref=refs/tags/${RELEASE_TAG}" \
            --raw-field "sha=${GITHUB_SHA}"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: prod-frame-${{ steps.version.outputs.tag }}.zip
