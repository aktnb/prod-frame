name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - name: Create and verify distribution zip
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist-zip
          (cd dist && zip -r "../dist-zip/prod-frame-${RELEASE_TAG}.zip" .)
          python3 - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = json.loads(Path("package.json").read_text())["version"]
          with zipfile.ZipFile(f"dist-zip/prod-frame-{tag}.zip") as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Distribution zip is corrupt")
              manifest = json.loads(archive.read("manifest.json"))
              if manifest["version"] != version or tag != f"v{version}":
                  raise SystemExit("Manifest, package and tag versions must match")
          PY

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist-zip/prod-frame-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
